<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e39" />
    <meta
      name="description"
      content="NFL players, opponent defenses and injury reports. A snowball project."
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="canonical" href="https://snowball-projects.github.io/optasy/" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=0.8.0" />
    <title>optasy · snowball</title>
  </head>
  <body>
    <a class="skip-link" href="#reports">Skip to player tiles</a>
    <header class="toolbar" aria-label="Player search">
      <div class="toolbar-brand">
        <a class="brand" href="./" aria-label="optasy"
          ><img src="icon.svg" width="34" height="34" alt="" /><span
            >optasy</span
          ></a
        >
      </div>
      <div class="toolbar-controls">
        <div class="search-area">
          <label class="sr-only" for="search">Find an NFL player</label>
          <input
            id="search"
            type="search"
            placeholder="Search players"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="search-help"
            aria-controls="search-results"
            disabled
          />
          <p id="search-help" class="sr-only">
            Choose up to six players. Injured rostered players are included.
          </p>
          <div id="search-results" class="search-results" hidden></div>
          <p id="search-status" class="sr-only" role="status"></p>
        </div>
        <label class="sr-only" for="week">NFL week</label>
        <select id="week" disabled>
          <option>Week unavailable</option>
        </select>
      </div>
      <div class="toolbar-info">
        <div id="data-status" class="data-status" hidden></div>
        <button
          id="info"
          class="icon-button info-button"
          aria-label="Sources and information"
        >
          i
        </button>
      </div>
    </header>
    <div class="refresh-bar">
      <button
        id="refresh"
        data-preserve-popover
        type="button"
        aria-label="Refresh shared data"
      >
        ↻ Refresh</button
      ><span id="refresh-state" role="status" aria-live="polite"
        >Checking shared data…</span
      >
    </div>
    <main
      id="reports"
      class="board"
      tabindex="-1"
      aria-label="Selected players and opponent defenses"
    >
      <h1 class="sr-only">Opponent defenses and injuries</h1>
      <p id="message" class="sr-only" role="status"></p>
      <p id="selection-count" class="sr-only">0 of 6 players selected</p>
      <div id="cards" class="tiles"></div>
      <noscript><p>JavaScript is required to display the reports.</p></noscript>
    </main>
    <script type="module" src="app.mjs?v=0.8.0"></script>
  </body>
</html>
